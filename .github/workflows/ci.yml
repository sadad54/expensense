name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  extraction-eval:
    name: Receipt extraction accuracy (SROIE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fetch SROIE (ICDAR 2019) receipts
        run: git clone --depth 1 https://github.com/zzzDavid/ICDAR-2019-SROIE.git /tmp/sroie
      - run: python eval/sroie_eval.py /tmp/sroie/data --split test --json /tmp/eval.json
      - run: python eval/check_thresholds.py /tmp/eval.json

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t expensense-api server

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - run: cp assets/.env.example assets/.env
      - run: flutter pub get
      - name: Analyze the receipt flow
        run: flutter analyze --no-fatal-infos lib/services lib/models/scanned_receipt.dart lib/views/scan test
      - run: flutter test
